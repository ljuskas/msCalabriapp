# CI de msCalabriapp.
#
# Todos los jobs de este workflow usan runners GitHub-hosted. Este workflow se
# ejecuta en pull_request (incluidos PR de forks) y en push a main; por eso no
# debe contener ningún job con runs-on self-hosted ni usar pull_request_target.
# El despliegue vive en publish-deploy.yml, que solo se dispara con push a main.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-image:
    name: Build, pruebas e imagen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar con Maven Wrapper
        run: ./mvnw -B -ntp verify

      - name: Construir imagen JVM
        run: |
          set -euo pipefail
          image="mscalabriapp:sha-${GITHUB_SHA}"
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "${image}" \
            .
          echo "Imagen construida: ${image}"

      - name: Smoke sin PostgreSQL
        run: ./scripts/ci/smoke-image.sh "mscalabriapp:sha-${GITHUB_SHA}"
