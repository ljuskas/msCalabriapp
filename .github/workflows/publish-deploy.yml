# Publicación y despliegue de msCalabriapp.
#
# Solo se dispara con push a main, es decir, después del merge de un PR. No usa
# workflow_dispatch: si hay que reintentar, se vuelve a ejecutar este mismo run
# desde la interfaz de Actions.
#
# - La publicación corre en un runner GitHub-hosted con GITHUB_TOKEN
#   (packages:write) y una etiqueta inmutable sha-${GITHUB_SHA}.
# - El despliegue corre en el runner self-hosted dedicado con la etiqueta exacta
#   clabriapp-local-main. Usa kubectl y el kubeconfig preinstalado; no usa Docker.
# - Antes de tocar el clúster hace un preflight anónimo contra GHCR. La
#   visibilidad del paquete es independiente de la del repositorio y un paquete
#   nuevo puede nacer privado.
name: Publicar y desplegar

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serializa los runs de main y no cancela despliegues en curso. Un push nuevo
# espera a que termine el run anterior en lugar de interrumpirlo.
concurrency:
  group: publish-deploy-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar imagen en GHCR
    if: >-
      github.repository == 'ljuskas/msCalabriapp' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar antes de publicar
        run: ./mvnw -B -ntp verify

      - name: Construir imagen inmutable
        run: |
          set -euo pipefail
          image="ghcr.io/ljuskas/mscalabriapp:sha-${GITHUB_SHA}"
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "${image}" \
            .
          echo "Imagen construida: ${image}"

      - name: Smoke sin PostgreSQL
        run: ./scripts/ci/smoke-image.sh "ghcr.io/ljuskas/mscalabriapp:sha-${GITHUB_SHA}"

      - name: Autenticar en GHCR con GITHUB_TOKEN
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publicar etiqueta sha inmutable
        run: |
          set -euo pipefail
          image="ghcr.io/ljuskas/mscalabriapp:sha-${GITHUB_SHA}"
          docker push "${image}"
          echo "Imagen publicada: ${image}"
          docker inspect --format='{{index .RepoDigests 0}}' "${image}" || true

  deploy:
    name: Desplegar en LocalEmu
    needs: publish
    # Condiciones explícitas: repositorio esperado, evento push y ref main.
    # No se añade workflow_dispatch ni ningún disparador de pull_request.
    if: >-
      github.repository == 'ljuskas/msCalabriapp' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - clabriapp-local-main
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KUBECONFIG: /etc/mscalabriapp-runner/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Comprobar herramientas y kubeconfig local
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA no tiene el formato esperado de 40 caracteres hexadecimales."
            exit 1
          fi
          for cmd in kubectl curl; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              echo "::error::Falta ${cmd} en el runner self-hosted clabriapp-local-main."
              exit 1
            fi
          done
          if [ ! -r "${KUBECONFIG}" ]; then
            echo "::error::No se puede leer ${KUBECONFIG}. El runner requiere el kubeconfig preinstalado y legible."
            exit 1
          fi
          kubectl version --client

      - name: Preflight anónimo de GHCR
        run: ./scripts/ci/preflight-ghcr.sh ljuskas/mscalabriapp "sha-${GITHUB_SHA}"

      - name: Comprobar acceso al namespace existente
        run: |
          set -euo pipefail
          # No se crea el namespace: clabriapp debe existir previamente.
          kubectl -n clabriapp get deployments --request-timeout=15s >/dev/null
          if [ "$(kubectl auth can-i patch deployments -n clabriapp)" != "yes" ]; then
            echo "::error::El kubeconfig del runner no puede actualizar Deployments en el namespace clabriapp."
            exit 1
          fi
          if [ "$(kubectl auth can-i get secrets -n clabriapp)" = "yes" ]; then
            echo "::error::El kubeconfig del runner puede leer Secrets en clabriapp. Usa la ServiceAccount clabriapp-deployer del bootstrap, que no tiene get sobre Secrets."
            exit 1
          fi

      - name: Aplicar Deployment y Service
        run: |
          set -euo pipefail
          image="ghcr.io/ljuskas/mscalabriapp:sha-${GITHUB_SHA}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          mkdir -p "${tmp}/app"
          # Solo los YAML que forman la kustomization; el README no se aplica.
          cp k8s/app/deployment.yaml k8s/app/service.yaml k8s/app/kustomization.yaml "${tmp}/app/"

          # El manifiesto versionado conserva el marcador; el SHA real solo se
          # sustituye en el directorio temporal que se aplica al clúster.
          sed -i "s/__GITHUB_SHA__/${GITHUB_SHA}/g" "${tmp}/app/deployment.yaml"
          if grep -R -n '__GITHUB_SHA__' "${tmp}/app" >/dev/null; then
            echo "::error::Quedó el marcador __GITHUB_SHA__ sin sustituir en los manifiestos."
            exit 1
          fi

          # apply -k incluye solo Deployment y Service. El bootstrap RBAC vive
          # aparte y no se aplica desde este workflow.
          kubectl apply -k "${tmp}/app"

          actual_image="$(kubectl -n clabriapp get deployment mscalabriapp \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [ "${actual_image}" != "${image}" ]; then
            echo "::error::La imagen aplicada no coincide. Esperada: ${image}; observada: ${actual_image}."
            exit 1
          fi

          kubectl -n clabriapp rollout status deployment/mscalabriapp --timeout=180s
          echo "Despliegue completado con la imagen ${image}"
