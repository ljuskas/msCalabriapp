quarkus.application.name=msCalabriapp
quarkus.application.version=0.1.0-SNAPSHOT
quarkus.banner.enabled=false
quarkus.log.level=INFO

# SmallRye Health expone /health, /health/live y /health/ready.
quarkus.smallrye-health.root-path=/health

# Valores del adaptador en memoria. Mantener sincronizados con pom.xml.
clabriapp.service.name=msCalabriapp
clabriapp.service.display-name=ClabriApp
clabriapp.service.version=0.1.0-SNAPSHOT

# ---------------------------------------------------------------------------
# Datasource PostgreSQL (subtarea 23.5)
#
# Solo se integra el driver JDBC y el datasource. No hay ORM, repositorios ni
# migraciones: eso corresponde a la subtarea 23.9. Las credenciales se toman
# de variables de entorno inyectadas desde el Secret clabriapp-postgresql.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:}
quarkus.datasource.password=${DB_PASSWORD:}
# currentSchema fija el schema por defecto. El rol clabriapp_app ya tiene
# search_path=clabriapp, pg_catalog; no se tocan roles ni schemas desde la app.
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:heraap}?currentSchema=clabriapp

# Health check de Agroal/SmallRye incluido por las extensiones. Se publica en
# /health/ready y solo valida la conexión; no lee tablas ni filas.
quarkus.datasource.health.enabled=true

# Nunca levantar un PostgreSQL adicional. Se desactiva Dev Services de forma
# global y también para el datasource, en todos los perfiles.
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

# Pruebas unitarias sin base de datos: el datasource no se crea, no se conecta
# y no contribuye al health check en el perfil test.
%test.quarkus.datasource.active=false
